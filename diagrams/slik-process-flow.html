      <line x1="890" y1="445" x2="890" y2="467" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- NEW: Truncate target -->
      <rect x="695" y="469" width="390" height="60" rx="6" fill="none" stroke="#d97706" stroke-width="1.8"/>
      <text x="710" y="487" font-size="10" opacity="0.6" font-style="italic">[ Execute SQL Task ]</text>
      <text x="890" y="505" text-anchor="middle" font-size="12" font-weight="650" fill="#d97706">4b. Truncate Target</text>
      <text x="890" y="521" text-anchor="middle" font-size="10" fill="#d97706" opacity="0.85">TRUNCATE TABLE ifin.d02_staging</text>
      <line x1="890" y1="529" x2="890" y2="551" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <rect x="695" y="553" width="390" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="710" y="573" font-size="10" opacity="0.6" font-style="italic">[ Data Flow Task ]</text>
      <text x="890" y="594" text-anchor="middle" font-size="12.5" font-weight="650">5b. Load &amp; Push (Multicast)</text>
      <text x="890" y="613" text-anchor="middle" font-size="10" opacity="0.75">Source : mis, d02_staging</text>
      <text x="890" y="629" text-anchor="middle" font-size="10" opacity="0.75">→ Destination Target : ifin, d02_staging</text>
      <text x="890" y="645" text-anchor="middle" font-size="10" opacity="0.75">→ Destination : mis, d02_Staging_hist</text>

      <!-- Converge -->
      <line x1="310" y1="663" x2="310" y2="710" stroke="currentColor" stroke-width="1.4"/>

      <text x="110" y="945" font-size="12" font-weight="650">OnError Event Handler (di level Package)</text>
      <text x="110" y="968" font-size="11" opacity="0.75">Jika langkah di cabang D01 ATAU D02 gagal di titik manapun → fire otomatis, tidak perlu precedence constraint merah manual</text>

      <rect x="430" y="978" width="340" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="600" y="1008" text-anchor="middle" font-size="12">INSERT INTO slik_ssis_process_log</text>

    <figcaption>
      Setelah <b>Truncate Staging</b>, package pecah jadi <b>2 Sequence Container paralel</b> — <b>D01 (Personal)</b> dan <b>D02 (Company)</b>. Tiap cabang: Extract &amp; Filter → Data Validation → <b>Truncate Target</b> (jalur oranye, `TRUNCATE TABLE ifin.d0X_staging` — perlu dikonfirmasi ke tim IFIN karena berpotensi mengubah `id`/`ukey` yang mereka generate) → Load &amp; Push. Kedua cabang harus <b>sama-sama selesai</b> sebelum lanjut ke <b>Update Run Log</b>. <b>OnError Event Handler</b> di level package menangkap error dari cabang manapun tanpa perlu dipisah per-container.
    </figcaption>
