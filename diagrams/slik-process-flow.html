<style>

  body {
    margin: 0;

<div class="wrap">
  <h1>SSIS Process Flow — GetDataSlikFromConfins</h1>
  <p class="subtitle">Control Flow package, bercabang jadi D01 (Company) &amp; D02 (Perorangan) yang berjalan paralel</p>

  <figure>
    <svg viewBox="0 0 1200 1080" role="img" aria-label="Package SSIS dimulai dari Truncate Staging untuk staging_d01 dan staging_d02, lalu bercabang jadi dua Sequence Container paralel: D01 untuk company dan D02 untuk perorangan, masing-masing punya langkah Extract dan Filter, Data Validation, dan Load dan Push lewat Multicast ke IFIN, Confins, dan History. Kedua cabang bertemu kembali sebelum Update Run Log. Kalau ada error di langkah manapun, OnError Event Handler mencatatnya ke tabel slik_ssis_process_log.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- Start -->
      <rect x="480" y="20" width="240" height="50" rx="25" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="600" y="51" text-anchor="middle" font-size="13" font-weight="650">START — Package Execute</text>
      <line x1="600" y1="70" x2="600" y2="98" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 1: Truncate Staging -->
      <rect x="410" y="100" width="380" height="65" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="430" y="122" font-size="10" opacity="0.6" font-style="italic">[ Execute SQL Task ]</text>
      <text x="600" y="145" text-anchor="middle" font-size="13" font-weight="650">1. Truncate Staging (staging_d01 &amp; staging_d02)</text>

      <!-- Split into 2 parallel branches -->
      <line x1="600" y1="165" x2="600" y2="192" stroke="currentColor" stroke-width="1.4"/>
      <line x1="310" y1="192" x2="890" y2="192" stroke="currentColor" stroke-width="1.4"/>
      <line x1="310" y1="192" x2="310" y2="213" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="890" y1="192" x2="890" y2="213" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="600" y="184" text-anchor="middle" font-size="10.5" opacity="0.7">berjalan paralel</text>

      <!-- Sequence Container D01 -->
      <rect x="90" y="215" width="440" height="430" rx="8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
      <text x="110" y="240" font-size="12.5" font-weight="650">Sequence Container — D01 (Company)</text>

      <rect x="115" y="255" width="390" height="88" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="130" y="275" font-size="10" opacity="0.6" font-style="italic">[ Data Flow Task ]</text>
      <text x="310" y="296" text-anchor="middle" font-size="12.5" font-weight="650">2a. Extract &amp; Filter</text>
      <text x="310" y="314" text-anchor="middle" font-size="10.5" opacity="0.75">Source (Confins, cust_type=company)</text>
      <text x="310" y="330" text-anchor="middle" font-size="10.5" opacity="0.75">→ Lookup d01_staging → staging_d01</text>
      <line x1="310" y1="343" x2="310" y2="365" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <rect x="115" y="367" width="390" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="130" y="387" font-size="10" opacity="0.6" font-style="italic">[ Execute SQL Task ]</text>
      <text x="310" y="408" text-anchor="middle" font-size="12.5" font-weight="650">3a. Data Validation</text>
      <text x="310" y="426" text-anchor="middle" font-size="10.5" opacity="0.75">UPDATE staging_d01 SET ... = dbo.fn_*()</text>
      <line x1="310" y1="445" x2="310" y2="467" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <rect x="115" y="469" width="390" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="130" y="489" font-size="10" opacity="0.6" font-style="italic">[ Data Flow Task ]</text>
      <text x="310" y="510" text-anchor="middle" font-size="12.5" font-weight="650">4a. Load &amp; Push (Multicast)</text>
      <text x="310" y="530" text-anchor="middle" font-size="10.5" opacity="0.75">UPDATE IFIN (d01_staging)</text>
      <text x="310" y="547" text-anchor="middle" font-size="10.5" opacity="0.75">UPDATE Confins (1 tabel)</text>
      <text x="310" y="564" text-anchor="middle" font-size="10.5" opacity="0.75">Insert etl_d01_history</text>

      <!-- Sequence Container D02 -->
      <rect x="670" y="215" width="440" height="430" rx="8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
      <text x="690" y="240" font-size="12.5" font-weight="650">Sequence Container — D02 (Perorangan)</text>

      <rect x="695" y="255" width="390" height="88" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="710" y="275" font-size="10" opacity="0.6" font-style="italic">[ Data Flow Task ]</text>
      <text x="890" y="296" text-anchor="middle" font-size="12.5" font-weight="650">2b. Extract &amp; Filter</text>
      <text x="890" y="314" text-anchor="middle" font-size="10.5" opacity="0.75">Source (Confins, cust_type=personal, +spouse)</text>
      <text x="890" y="330" text-anchor="middle" font-size="10.5" opacity="0.75">→ Lookup d02_staging → staging_d02</text>
      <line x1="890" y1="343" x2="890" y2="365" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <rect x="695" y="367" width="390" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="710" y="387" font-size="10" opacity="0.6" font-style="italic">[ Execute SQL Task ]</text>
      <text x="890" y="408" text-anchor="middle" font-size="12.5" font-weight="650">3b. Data Validation</text>
      <text x="890" y="426" text-anchor="middle" font-size="10.5" opacity="0.75">UPDATE staging_d02 SET ... = dbo.fn_*()</text>
      <line x1="890" y1="445" x2="890" y2="467" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <rect x="695" y="469" width="390" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="710" y="489" font-size="10" opacity="0.6" font-style="italic">[ Data Flow Task ]</text>
      <text x="890" y="510" text-anchor="middle" font-size="12.5" font-weight="650">4b. Load &amp; Push (Multicast)</text>
      <text x="890" y="530" text-anchor="middle" font-size="10.5" opacity="0.75">UPDATE IFIN (d02_staging)</text>
      <text x="890" y="547" text-anchor="middle" font-size="10.5" opacity="0.75">UPDATE Confins (1 tabel)</text>
      <text x="890" y="564" text-anchor="middle" font-size="10.5" opacity="0.75">Insert etl_d02_history</text>

      <!-- Converge -->
      <line x1="310" y1="645" x2="310" y2="690" stroke="currentColor" stroke-width="1.4"/>
      <line x1="890" y1="645" x2="890" y2="690" stroke="currentColor" stroke-width="1.4"/>
      <line x1="310" y1="690" x2="890" y2="690" stroke="currentColor" stroke-width="1.4"/>
      <text x="600" y="683" text-anchor="middle" font-size="10.5" opacity="0.7">tunggu dua-duanya selesai</text>
      <line x1="600" y1="690" x2="600" y2="718" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 5: Update Run Log -->
      <rect x="430" y="720" width="340" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="450" y="742" font-size="10" opacity="0.6" font-style="italic">[ Execute SQL Task ]</text>
      <text x="600" y="765" text-anchor="middle" font-size="13" font-weight="650">5. Update Run Log</text>
      <text x="600" y="782" text-anchor="middle" font-size="11" opacity="0.75">status = SUCCESS, end_time = GETDATE()</text>
      <line x1="600" y1="790" x2="600" y2="818" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- End -->
      <rect x="480" y="820" width="240" height="50" rx="25" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="600" y="851" text-anchor="middle" font-size="13" font-weight="650">END — Success</text>

      <!-- Error handling side path -->
      <rect x="90" y="900" width="1020" height="120" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
      <text x="110" y="925" font-size="12" font-weight="650">OnError Event Handler (di level Package)</text>
      <text x="110" y="948" font-size="11" opacity="0.75">Jika langkah di cabang D01 ATAU D02 gagal di titik manapun → fire otomatis, tidak perlu precedence constraint merah manual</text>

      <rect x="430" y="958" width="340" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="600" y="988" text-anchor="middle" font-size="12">INSERT INTO slik_ssis_process_log</text>
    </svg>

    <figcaption>
      Setelah <b>Truncate Staging</b>, package pecah jadi <b>2 Sequence Container paralel</b> — satu untuk <b>D01 (Company)</b>, satu untuk <b>D02 (Perorangan)</b> — dengan struktur langkah yang identik (Extract &amp; Filter → Data Validation → Load &amp; Push), cuma beda filter <code>cust_type</code>, tabel staging, dan tabel tujuan. Kedua cabang harus <b>sama-sama selesai</b> sebelum lanjut ke <b>Update Run Log</b> (default precedence constraint SSIS: AND logic kalau ada lebih dari satu jalur masuk ke satu task). <b>OnError Event Handler</b> di level package menangkap error dari cabang manapun tanpa perlu dipisah per-container.
    </figcaption>
  </figure>
</div>
