      <b>d01_staging</b> — semua 52 kolom ditulis lengkap sesuai DDL real (11 kolom pertama NOT NULL: <code>id</code>, <code>ukey</code>, audit <code>cre_*</code>/<code>mod_*</code>, <code>form_transaction_id</code>, <code>flag_detail</code>, <code>cif</code>; sisanya nullable). Kolom <code>id</code> di-copy dari IFIN (VARCHAR, bukan identity). <b>d01_staging_hist</b> punya PK sendiri (<code>staging_hist_id BIGINT IDENTITY(1,1)</code>) dan mirror seluruh kolom <code>d01_staging</code> apa adanya, ditambah <code>load_dt DATETIME</code>. Sengaja <b>tidak ada FK</b> dari hist ke staging, karena <code>d01_staging</code> di-<b>TRUNCATE</b> tiap run dan SQL Server menolak TRUNCATE pada tabel yang direferensikan FK.
