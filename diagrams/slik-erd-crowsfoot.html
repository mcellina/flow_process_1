<div class="wrap">
  <h1>ERD — d01_staging / d01_staging_hist</h1>
  <p class="subtitle">Crow's foot notation</p>

  <figure>
    <svg viewBox="0 0 900 460" role="img" aria-label="d01_staging berisi kolom NOT NULL sebagai struktur inti (id, ukey, kolom audit cre dan mod, form_transaction_id, flag_detail, cif), plus 41 kolom nullable lain untuk data SLIK. d01_staging_hist punya PK sendiri staging_hist_id, mirror seluruh kolom d01_staging, dan kolom load_dt, tanpa foreign key ke d01_staging karena tabel itu di-truncate tiap run.">
      <!-- ===== d01_staging ===== -->
      <g>
        <rect x="40" y="30" width="400" height="26" fill="#1f2430"/>
        <text x="240" y="48" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">d01_staging</text>
        <rect x="40" y="56" width="400" height="286" fill="none" stroke="#1f2430" stroke-width="1.3"/>

        <line x1="86" y1="56" x2="86" y2="342" stroke="#c9c9c9" stroke-width="1"/>
        <g font-size="11" fill="#1a1a1a">
          <text x="48" y="74" font-weight="700">PK</text><text x="92" y="74">id</text><text x="432" y="74" text-anchor="end" fill="#666">VARCHAR(50) NN</text>
          <line x1="40" y1="82" x2="440" y2="82" stroke="#e3e3e3"/>
          <text x="92" y="100">ukey</text><text x="432" y="100" text-anchor="end" fill="#666">BIGINT NN</text>
          <line x1="40" y1="108" x2="440" y2="108" stroke="#e3e3e3"/>
          <text x="92" y="126">cre_date</text><text x="432" y="126" text-anchor="end" fill="#666">DATETIME2(7) NN</text>
          <line x1="40" y1="134" x2="440" y2="134" stroke="#e3e3e3"/>
          <text x="92" y="152">cre_by</text><text x="432" y="152" text-anchor="end" fill="#666">VARCHAR(15) NN</text>
          <line x1="40" y1="160" x2="440" y2="160" stroke="#e3e3e3"/>
          <text x="92" y="178">cre_ip_address</text><text x="432" y="178" text-anchor="end" fill="#666">VARCHAR(15) NN</text>
          <line x1="40" y1="186" x2="440" y2="186" stroke="#e3e3e3"/>
          <text x="92" y="204">mod_date</text><text x="432" y="204" text-anchor="end" fill="#666">DATETIME2(7) NN</text>
          <line x1="40" y1="212" x2="440" y2="212" stroke="#e3e3e3"/>
          <text x="92" y="230">mod_by</text><text x="432" y="230" text-anchor="end" fill="#666">VARCHAR(15) NN</text>
          <line x1="40" y1="238" x2="440" y2="238" stroke="#e3e3e3"/>
          <text x="92" y="256">mod_ip_address</text><text x="432" y="256" text-anchor="end" fill="#666">VARCHAR(15) NN</text>
          <line x1="40" y1="264" x2="440" y2="264" stroke="#e3e3e3"/>
          <text x="92" y="282">form_transaction_id</text><text x="432" y="282" text-anchor="end" fill="#666">VARCHAR(50) NN</text>
          <line x1="40" y1="290" x2="440" y2="290" stroke="#e3e3e3"/>
          <text x="92" y="308">flag_detail</text><text x="432" y="308" text-anchor="end" fill="#666">VARCHAR(2) NN</text>
          <line x1="40" y1="316" x2="440" y2="316" stroke="#e3e3e3"/>
          <text x="92" y="334">cif</text><text x="432" y="334" text-anchor="end" fill="#666">VARCHAR(40) NN</text>
        </g>
        <text x="52" y="356" font-style="italic" fill="#888" font-size="10">+ 41 kolom lain, semua NULL-able (nik, nama, alamat, *_ojk_code, pasangan,</text>
        <text x="52" y="370" font-style="italic" fill="#888" font-size="10">penghasilan, period, dll — lihat Data Dictionary)</text>
      </g>

      <!-- ===== d01_staging_hist ===== -->
      <g>
        <rect x="560" y="30" width="300" height="146" fill="none" stroke="#1f2430" stroke-width="1.3"/>
        <rect x="560" y="30" width="300" height="26" fill="#1f2430"/>
        <text x="710" y="48" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">d01_staging_hist</text>
        <line x1="606" y1="56" x2="606" y2="176" stroke="#c9c9c9" stroke-width="1"/>
        <g font-size="11" fill="#1a1a1a">
          <text x="568" y="74" font-weight="700">PK</text><text x="612" y="74">staging_hist_id</text><text x="852" y="74" text-anchor="end" fill="#666">BIGINT IDENTITY(1,1)</text>
          <line x1="560" y1="82" x2="860" y2="82" stroke="#e3e3e3"/>
          <text x="612" y="99" font-style="italic" fill="#666">↳ seluruh kolom sama seperti</text>
          <text x="612" y="113" font-style="italic" fill="#666">d01_staging (id, cif, nik, ... dst)</text>
          <text x="612" y="127" font-style="italic" fill="#888" font-size="9.5">   (kolom "id" tetap VARCHAR(50), bukan identity — dari IFIN)</text>
          <line x1="560" y1="135" x2="860" y2="135" stroke="#e3e3e3"/>
          <text x="612" y="153">load_dt</text><text x="852" y="153" text-anchor="end" fill="#666">DATETIME</text>
        </g>
      </g>

      <!-- no FK: d01_staging di-truncate tiap run -->
      <line x1="440" y1="100" x2="558" y2="100" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="499" y="90" font-size="9.5" fill="#999" font-style="italic" text-anchor="middle">nggak ada FK</text>
      <text x="499" y="115" font-size="9.5" fill="#999" font-style="italic" text-anchor="middle">(staging di-truncate)</text>
    </svg>

    <figcaption>
      <b>d01_staging</b> — 52 kolom total; yang ditampilkan di sini cuma kolom <b>NOT NULL</b> (struktur inti: <code>id</code>, <code>ukey</code>, audit <code>cre_*</code>/<code>mod_*</code>, <code>form_transaction_id</code>, <code>flag_detail</code>, <code>cif</code>). Sisanya (41 kolom) semua nullable, lihat Data Dictionary. Kolom <code>id</code> di-copy dari IFIN (VARCHAR, bukan identity). <b>d01_staging_hist</b> punya PK sendiri (<code>staging_hist_id BIGINT IDENTITY(1,1)</code>) dan mirror seluruh kolom <code>d01_staging</code> apa adanya, ditambah <code>load_dt DATETIME</code>. Sengaja <b>tidak ada FK</b> dari hist ke staging, karena <code>d01_staging</code> di-<b>TRUNCATE</b> tiap run dan SQL Server menolak TRUNCATE pada tabel yang direferensikan FK.
    </figcaption>
  </figure>
</div>
