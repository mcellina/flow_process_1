<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Alur Proses Bisnis — Pembentukan &amp; Pengiriman Form D01</title>
<style>
  :root { color-scheme: light; }
  html, body {
    background: #ffffff;
    color: #1a1a1a;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  figure { margin: 0; padding: 32px; background: #ffffff; }
  figcaption {
    max-width: 900px;
    margin: 20px auto 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: #444444;
  }
  svg text { fill: #1a1a1a; }
</style>
</head>
<body>
  <figure>
    <svg viewBox="0 0 1000 1230" role="img" aria-label="Alur proses bisnis pembentukan dan pengiriman Form D01: dari pengambilan CIF/NIK di iFin, pembentukan data dari Confins, penyimpanan dan validasi di staging MIS, pengiriman data ke iFin yang lalu bercabang jadi dua tujuan paralel — insert/update tabel D01 dan update status di iFin, serta insert ke tabel history di MIS — sebelum berakhir.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- Title -->
      <text x="40" y="36" font-size="19" font-weight="700">Alur Proses Bisnis — Pembentukan &amp; Pengiriman Form D01</text>
      <text x="40" y="58" font-size="12.5" opacity="0.65">SLIK OJK · GetDataSlikFromConfins — dari pengambilan CIF/NIK hingga update status di iFin</text>

      <!-- Start -->
      <rect x="380" y="110" width="240" height="50" rx="25" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="500" y="141" text-anchor="middle" font-size="13" font-weight="650">START</text>
      <line x1="500" y1="160" x2="500" y2="198" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 1 -->
      <rect x="240" y="200" width="520" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="240" y="200" width="5" height="72" rx="2.5" fill="#2563eb"/>
      <circle cx="274" cy="236.0" r="14" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="274" y="240.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb">1</text>
      <text x="302" y="219" font-size="9" font-weight="650" letter-spacing="0.4" fill="#2563eb">IFIN</text>
      <text x="302" y="236" font-size="12.5" font-weight="650">Pengambilan Data CIF / NIK</text>
      <text x="302" y="253" font-size="10" opacity="0.75">Ambil data CIF / NIK dari iFin sebagai acuan pembentukan Form D01</text>
      <line x1="500.0" y1="272" x2="500.0" y2="300" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 2 -->
      <rect x="240" y="302" width="520" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="240" y="302" width="5" height="72" rx="2.5" fill="#059669"/>
      <circle cx="274" cy="338.0" r="14" fill="none" stroke="#059669" stroke-width="1.5"/>
      <text x="274" y="342.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#059669">2</text>
      <text x="302" y="321" font-size="9" font-weight="650" letter-spacing="0.4" fill="#059669">MIS  •  SUMBER: CONFINS</text>
      <text x="302" y="338" font-size="12.5" font-weight="650">Extract dan Filter Data Form D01</text>
      <text x="302" y="355" font-size="10" opacity="0.75">Bentuk data Form D01 berdasarkan CIF / NIK; detail debitur diambil dari Confins</text>
      <line x1="500.0" y1="374" x2="500.0" y2="402" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 3 -->
      <rect x="240" y="404" width="520" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="240" y="404" width="5" height="72" rx="2.5" fill="#059669"/>
      <circle cx="274" cy="440.0" r="14" fill="none" stroke="#059669" stroke-width="1.5"/>
      <text x="274" y="444.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#059669">3</text>
      <text x="302" y="423" font-size="9" font-weight="650" letter-spacing="0.4" fill="#059669">MIS</text>
      <text x="302" y="440" font-size="12.5" font-weight="650">Data Store ke D01_staging</text>
      <text x="302" y="457" font-size="10" opacity="0.75">Simpan data detail debitur ke database MIS, tabel D01_staging</text>
      <line x1="500.0" y1="476" x2="500.0" y2="504" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 4 -->
      <rect x="240" y="506" width="520" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="240" y="506" width="5" height="72" rx="2.5" fill="#059669"/>
      <circle cx="274" cy="542.0" r="14" fill="none" stroke="#059669" stroke-width="1.5"/>
      <text x="274" y="546.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#059669">4</text>
      <text x="302" y="525" font-size="9" font-weight="650" letter-spacing="0.4" fill="#059669">MIS</text>
      <text x="302" y="542" font-size="12.5" font-weight="650">Validasi Data D01_staging</text>
      <text x="302" y="559" font-size="10" opacity="0.75">Validasi tabel D01_staging menggunakan function</text>
      <line x1="500.0" y1="578" x2="500.0" y2="606" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 5 -->
      <rect x="240" y="608" width="520" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="240" y="608" width="5" height="72" rx="2.5" fill="#d97706"/>
      <circle cx="274" cy="644.0" r="14" fill="none" stroke="#d97706" stroke-width="1.5"/>
      <text x="274" y="648.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d97706">5</text>
      <text x="302" y="627" font-size="9" font-weight="650" letter-spacing="0.4" fill="#d97706">MIS → IFIN</text>
      <text x="302" y="644" font-size="12.5" font-weight="650">Load Data</text>
      <text x="302" y="661" font-size="10" opacity="0.75">Kirim cleaned data dari MIS (Staging) ke iFin</text>

      <!-- Fork -->
      <line x1="500" y1="680" x2="500" y2="710" stroke="currentColor" stroke-width="1.4"/>
      <line x1="290.0" y1="710" x2="710.0" y2="710" stroke="currentColor" stroke-width="1.4"/>
      <line x1="290.0" y1="710" x2="290.0" y2="728" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="710.0" y1="710" x2="710.0" y2="728" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="500" y="704" text-anchor="middle" font-size="10.5" opacity="0.7">berjalan paralel — 2 tujuan dari satu pengiriman</text>

      <!-- Step 6a -->
      <rect x="100" y="730" width="380" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="100" y="730" width="5" height="72" rx="2.5" fill="#2563eb"/>
      <circle cx="130" cy="766.0" r="13" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="130" y="770.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">6a</text>
      <text x="154" y="749" font-size="9" font-weight="650" letter-spacing="0.4" fill="#2563eb">IFIN</text>
      <text x="154" y="766" font-size="12" font-weight="650">Insert / Update Tabel D01</text>
      <text x="154" y="783" font-size="9.5" opacity="0.75">Insert / update ke tabel D01 pada server database iFin</text>
      <line x1="290.0" y1="802" x2="290.0" y2="830" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- Step 7a -->
      <rect x="100" y="832" width="380" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="100" y="832" width="5" height="72" rx="2.5" fill="#2563eb"/>
      <circle cx="130" cy="868.0" r="13" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="130" y="872.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">7a</text>
      <text x="154" y="851" font-size="9" font-weight="650" letter-spacing="0.4" fill="#2563eb">IFIN</text>
      <text x="154" y="868" font-size="12" font-weight="650">Update Status</text>
      <text x="154" y="885" font-size="9.5" opacity="0.75">Update flag = 0 pada table log di iFin</text>

      <!-- Step 6b -->
      <rect x="520" y="730" width="380" height="72" rx="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="520" y="730" width="5" height="72" rx="2.5" fill="#059669"/>
      <circle cx="550" cy="766.0" r="13" fill="none" stroke="#059669" stroke-width="1.5"/>
      <text x="550" y="770.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#059669">6b</text>
      <text x="574" y="749" font-size="9" font-weight="650" letter-spacing="0.4" fill="#059669">MIS</text>
      <text x="574" y="766" font-size="12" font-weight="650">Insert ke D01_History</text>
      <text x="574" y="783" font-size="9.5" opacity="0.75">Insert data D01_staging ke tabel D01_History (MIS)</text>

      <!-- Converge -->
      <line x1="290.0" y1="904" x2="290.0" y2="934" stroke="currentColor" stroke-width="1.4"/>
      <line x1="710.0" y1="802" x2="710.0" y2="934" stroke="currentColor" stroke-width="1.4"/>
      <line x1="290.0" y1="934" x2="710.0" y2="934" stroke="currentColor" stroke-width="1.4"/>
      <text x="500" y="928" text-anchor="middle" font-size="10.5" opacity="0.7">tunggu kedua cabang selesai</text>
      <line x1="500" y1="934" x2="500" y2="962" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

      <!-- End -->
      <rect x="380" y="964" width="240" height="50" rx="25" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="500" y="995" text-anchor="middle" font-size="13" font-weight="650">END</text>

      <!-- Legend -->
      <rect x="240" y="1040" width="14" height="14" rx="3" fill="#2563eb"/>
      <text x="260" y="1051" font-size="11" opacity="0.8">iFin</text>
      <rect x="320" y="1040" width="14" height="14" rx="3" fill="#059669"/>
      <text x="340" y="1051" font-size="11" opacity="0.8">MIS (Server ETL UUS SLIK)</text>
      <rect x="530" y="1040" width="14" height="14" rx="3" fill="#d97706"/>
      <text x="550" y="1051" font-size="11" opacity="0.8">Transisi antar-sistem</text>
    </svg>

    <figcaption>
      Alur bisnis pembentukan Form D01 dari sisi non-teknis (di luar detail komponen SSIS): <b>iFin</b> memberi CIF/NIK sebagai pemicu, <b>MIS</b> membentuk &amp; memvalidasi data (mengambil detail debitur dari <b>Confins</b>) di tabel <code>D01_staging</code>, lalu dikirim ke <b>iFin</b> pada langkah <b>5. Load Data</b>. Pengiriman ini punya <b>dua tujuan sekaligus</b> (mirip pola Multicast pada diagram SSIS teknis) — bukan dua langkah berurutan: <b>iFin</b> meng-insert/update tabel <code>D01</code> lalu meng-update status, sementara <b>MIS</b> secara paralel meng-insert salinan ke <code>D01_History</code> untuk jejak audit. Alur berakhir setelah kedua cabang selesai.
    </figcaption>
  </figure>
</body>
</html>
