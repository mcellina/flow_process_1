<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .wrap { max-width: 1060px; margin: 0 auto; }
  h1 { font-size: 1.25rem; font-weight: 650; margin: 0 0 0.2rem; }
  .subtitle { font-size: 0.92rem; opacity: 0.65; margin: 0 0 2rem; }
  figure { margin: 0; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  figcaption {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    line-height: 1.5;
    color: currentColor;
    opacity: 0.72;
    max-width: 860px;
  }
  figcaption b { opacity: 1; font-weight: 600; }
</style>

<div class="wrap">
  <h1>High-Level Architecture — SLIK Debtor Enrichment</h1>
  <p class="subtitle">Confins (source) — MIS UUS SLIK (ETL) — IFIN (target pelaporan SLIK)</p>

  <figure>
    <svg viewBox="0 0 1000 420" role="img" aria-label="IFIN memanggil SSIS GetDataSlikFromConfins yang berjalan di Server MIS UUS SLIK. SSIS ini menarik data customer dari Server S Confins, memvalidasi dan meng-enrich datanya, lalu menuliskan hasilnya balik ke dua tempat: satu tabel di Server S Confins, dan tabel d01_staging serta d02_staging di IFIN, keduanya lewat operasi UPDATE saja tanpa membuat tabel baru.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
        <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
        </marker>
      </defs>

      <!-- Server S / Confins -->
      <rect x="30" y="90" width="260" height="220" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="160" y="122" text-anchor="middle" font-size="15" font-weight="650">Server S</text>
      <text x="160" y="142" text-anchor="middle" font-size="11.5" opacity="0.68">Confins (Source)</text>
      <line x1="55" y1="156" x2="265" y2="156" stroke="currentColor" stroke-width="1" opacity="0.3"/>
      <text x="160" y="188" text-anchor="middle" font-size="12.5">cust</text>
      <text x="160" y="206" text-anchor="middle" font-size="10.5" opacity="0.68">~1,000,000 rows</text>
      <text x="160" y="282" text-anchor="middle" font-size="11.5" font-weight="650">READ (extract)</text>
      <text x="160" y="298" text-anchor="middle" font-size="11.5" font-weight="650" fill="#d97706">+ UPDATE (1 tabel)</text>

      <!-- Server MIS UUS SLIK -->
      <rect x="365" y="70" width="270" height="260" rx="10" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <text x="500" y="102" text-anchor="middle" font-size="15" font-weight="650">Server MIS UUS SLIK</text>
      <text x="500" y="122" text-anchor="middle" font-size="11" opacity="0.68">SSIS: GetDataSlikFromConfins</text>
      <line x1="390" y1="136" x2="610" y2="136" stroke="currentColor" stroke-width="1" opacity="0.3"/>
      <text x="500" y="176" text-anchor="middle" font-size="12.5">extract → validate → enrich</text>
      <text x="500" y="194" text-anchor="middle" font-size="10.5" opacity="0.68">customer sesuai cif/ukey di</text>
      <text x="500" y="210" text-anchor="middle" font-size="10.5" opacity="0.68">d01_staging / d02_staging</text>
      <text x="500" y="282" text-anchor="middle" font-size="11.5" font-weight="650">CREATE + READ + WRITE</text>
      <text x="500" y="298" text-anchor="middle" font-size="10.5" opacity="0.68">validasi &amp; simpan histori staging</text>

      <!-- IFIN / Server D -->
      <rect x="710" y="90" width="260" height="220" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="840" y="122" text-anchor="middle" font-size="15" font-weight="650">IFIN</text>
      <text x="840" y="142" text-anchor="middle" font-size="11.5" opacity="0.68">SLIK Staging (Target)</text>
      <line x1="735" y1="156" x2="945" y2="156" stroke="currentColor" stroke-width="1" opacity="0.3"/>
      <text x="840" y="188" text-anchor="middle" font-size="13">d01_staging</text>
      <text x="840" y="206" text-anchor="middle" font-size="13">d02_staging</text>
      <text x="840" y="282" text-anchor="middle" font-size="11.5" font-weight="650" fill="#d97706">UPDATE-ONLY</text>
      <text x="840" y="298" text-anchor="middle" font-size="10.5" fill="#d97706" opacity="0.85">(no CREATE TABLE)</text>

      <!-- Arrows left: S <-> MIS -->
      <line x1="292" y1="160" x2="363" y2="160" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="327" y="150" text-anchor="middle" font-size="10.5">extract cust data</text>

      <line x1="363" y1="230" x2="292" y2="230" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
      <text x="327" y="220" text-anchor="middle" font-size="10.5" fill="#d97706" font-weight="650">update hasil enrichment</text>

      <!-- Arrows right: MIS <-> IFIN -->
      <line x1="708" y1="150" x2="637" y2="150" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="672" y="140" text-anchor="middle" font-size="10.5">call SSIS + referensi cif/ukey</text>

      <line x1="637" y1="240" x2="708" y2="240" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
      <text x="672" y="230" text-anchor="middle" font-size="10.5" fill="#d97706" font-weight="650">update d01/d02_staging</text>
    </svg>

    <figcaption>
      <b>IFIN</b> memanggil SSIS <b>GetDataSlikFromConfins</b> yang berjalan di <b>Server MIS UUS SLIK</b> (server milik sendiri, hak penuh). SSIS ini menarik data customer dari <b>Server S (Confins)</b> untuk cif/ukey yang sudah ada di <code>d01_staging</code>/<code>d02_staging</code>, memvalidasi datanya, lalu menulis hasilnya balik ke <b>dua tempat</b> sekaligus — satu tabel di Confins dan ke IFIN — keduanya lewat <b>UPDATE saja</b>, karena tidak ada hak untuk membuat tabel staging baru di kedua server tersebut.
    </figcaption>
  </figure>
</div>
