<style>

<div class="wrap">
  <h1>Entity Relationship Diagram — SLIK Enrichment</h1>
  <p class="subtitle">Tabel milik Server MIS UUS SLIK (solid) dan tabel eksternal yang direferensikan (putus-putus)</p>

  <figure>

      <defs>
        <marker id="one" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
          <line x1="5" y1="0" x2="5" y2="10" stroke="currentColor" stroke-width="1.4"/>
        </marker>
      </defs>

      <!-- Row 1: external systems (dashed) -->
      <g opacity="0.85">
        <rect x="60" y="40" width="260" height="130" rx="4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 3"/>
        <text x="190" y="62" text-anchor="middle" font-size="13" font-weight="650">CUST</text>
        <text x="190" y="78" text-anchor="middle" font-size="10" opacity="0.65">(Server S — Confins)</text>
        <line x1="75" y1="86" x2="305" y2="86" stroke="currentColor" stroke-width="1" opacity="0.4"/>
        <text x="80" y="104" font-size="11" font-weight="650">PK  cust_id</text>
        <text x="80" y="122" font-size="11">cust_no (cif)</text>
        <text x="80" y="140" font-size="11">cust_type, spouse_id</text>
        <text x="80" y="158" font-size="11" opacity="0.65">... lihat Data Dictionary</text>

        <rect x="390" y="40" width="260" height="130" rx="4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 3"/>
        <text x="520" y="62" text-anchor="middle" font-size="13" font-weight="650">D01_STAGING</text>
        <text x="520" y="78" text-anchor="middle" font-size="10" opacity="0.65">(IFIN, di-generate)</text>
        <line x1="405" y1="86" x2="635" y2="86" stroke="currentColor" stroke-width="1" opacity="0.4"/>
        <text x="410" y="104" font-size="11" font-weight="650">PK  ukey</text>
        <text x="410" y="122" font-size="11">cif, nik, id</text>
        <text x="410" y="140" font-size="11">(kolom lain kosong,</text>
        <text x="410" y="158" font-size="11">diisi lewat proses ini)</text>

        <rect x="720" y="40" width="260" height="130" rx="4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 3"/>
        <text x="850" y="62" text-anchor="middle" font-size="13" font-weight="650">D02_STAGING</text>
        <text x="850" y="78" text-anchor="middle" font-size="10" opacity="0.65">(IFIN, di-generate)</text>
        <line x1="735" y1="86" x2="965" y2="86" stroke="currentColor" stroke-width="1" opacity="0.4"/>
        <text x="740" y="104" font-size="11" font-weight="650">PK  ukey</text>
        <text x="740" y="122" font-size="11">cif, nik, id</text>
        <text x="740" y="140" font-size="11">(kolom lain kosong,</text>
        <text x="740" y="158" font-size="11">diisi lewat proses ini)</text>

      <rect x="390" y="230" width="260" height="200" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="520" y="253" text-anchor="middle" font-size="13" font-weight="650">STG_STAGING_D01</text>

      <text x="410" y="296" font-size="11" font-weight="650">PK  cif</text>
      <text x="410" y="314" font-size="11">ukey</text>
      <text x="410" y="332" font-size="11">src_* (kolom mentah dari Confins)</text>
      <text x="410" y="350" font-size="11">nama, nik, alamat, ... (final)</text>
      <text x="410" y="368" font-size="11">*_ojk_code (hasil mapping)</text>
      <text x="410" y="386" font-size="11" opacity="0.65">~40 kolom, lihat Data Dictionary</text>

      <rect x="720" y="230" width="260" height="200" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="850" y="253" text-anchor="middle" font-size="13" font-weight="650">STG_STAGING_D02</text>
      <text x="850" y="269" text-anchor="middle" font-size="10" opacity="0.65">(Server MIS UUS SLIK)</text>
      <line x1="735" y1="277" x2="965" y2="277" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <text x="740" y="296" font-size="11" font-weight="650">PK  cif</text>
      <text x="740" y="314" font-size="11">ukey</text>
      <text x="740" y="332" font-size="11">src_* (kolom mentah dari Confins)</text>
      <text x="740" y="350" font-size="11">nik, nama, alamat, ... (final)</text>
      <text x="740" y="368" font-size="11">nama_pasangan, nik_pasangan</text>
      <text x="740" y="386" font-size="11" opacity="0.65">~40 kolom, lihat Data Dictionary</text>

      <!-- Row 3: run log -->
      <rect x="520" y="480" width="260" height="130" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="650" y="502" text-anchor="middle" font-size="13" font-weight="650">ETL_RUN_LOG</text>
      <line x1="535" y1="510" x2="765" y2="510" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <text x="540" y="528" font-size="11" font-weight="650">PK  run_id</text>
      <text x="540" y="546" font-size="11">package_name, status</text>
      <text x="540" y="564" font-size="11">start_time, end_time</text>
      <text x="540" y="582" font-size="11">rows_d01, rows_d02</text>

      <!-- Row 4: children of run log -->
      <rect x="140" y="700" width="240" height="130" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="260" y="722" text-anchor="middle" font-size="13" font-weight="650">ETL_D01_HISTORY</text>
      <line x1="155" y1="730" x2="365" y2="730" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <text x="160" y="748" font-size="11" font-weight="650">PK  history_id</text>
      <text x="160" y="766" font-size="11" font-style="italic">FK  run_id</text>
      <text x="160" y="784" font-size="11">cif, kolom_old, kolom_new</text>
      <text x="160" y="802" font-size="11">updated_at</text>

      <rect x="420" y="700" width="240" height="130" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="540" y="722" text-anchor="middle" font-size="13" font-weight="650">ETL_D02_HISTORY</text>
      <line x1="435" y1="730" x2="645" y2="730" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <text x="440" y="748" font-size="11" font-weight="650">PK  history_id</text>
      <text x="440" y="766" font-size="11" font-style="italic">FK  run_id</text>
      <text x="440" y="784" font-size="11">cif, kolom_old, kolom_new</text>
      <text x="440" y="802" font-size="11">updated_at</text>

      <rect x="700" y="700" width="260" height="130" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="830" y="722" text-anchor="middle" font-size="13" font-weight="650">SLIK_SSIS_PROCESS_LOG</text>
      <line x1="715" y1="730" x2="945" y2="730" stroke="currentColor" stroke-width="1" opacity="0.4"/>
      <text x="720" y="748" font-size="11" font-weight="650">PK  log_id</text>
      <text x="720" y="766" font-size="11" font-style="italic">FK  run_id</text>
      <text x="720" y="784" font-size="11">task_name, status</text>
      <text x="720" y="802" font-size="11">error_code, error_message</text>

      <!-- Dashed logical relations: external -> staging -->
      <line x1="190" y1="170" x2="480" y2="228" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
      <text x="280" y="212" font-size="10" opacity="0.7">cif (logical)</text>

      <line x1="230" y1="170" x2="780" y2="228" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
      <text x="470" y="185" font-size="10" opacity="0.7">cif (logical)</text>

      <line x1="520" y1="170" x2="520" y2="228" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
      <text x="528" y="200" font-size="10" opacity="0.7">ukey, cif</text>

      <line x1="850" y1="170" x2="850" y2="228" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/>
      <text x="858" y="200" font-size="10" opacity="0.7">ukey, cif</text>

      <!-- Solid relations: run_log -> children -->
      <line x1="620" y1="610" x2="280" y2="698" stroke="currentColor" stroke-width="1.4"/>
      <text x="640" y="605" font-size="10" opacity="0.75">1</text>
      <text x="300" y="693" font-size="10" opacity="0.75">N</text>

      <line x1="650" y1="610" x2="550" y2="698" stroke="currentColor" stroke-width="1.4"/>
      <text x="660" y="640" font-size="10" opacity="0.75">1</text>
      <text x="560" y="693" font-size="10" opacity="0.75">N</text>

      <line x1="700" y1="610" x2="830" y2="698" stroke="currentColor" stroke-width="1.4"/>
      <text x="705" y="605" font-size="10" opacity="0.75">1</text>
      <text x="815" y="693" font-size="10" opacity="0.75">N</text>
    </svg>

    <figcaption>
      Kotak putus-putus = tabel milik sistem lain (<b>Confins</b>, <b>IFIN</b>) yang direferensikan lewat <code>cif</code>/<code>ukey</code> — relasinya <b>logis</b>, bukan foreign key sungguhan karena beda server, jadi tidak bisa dipaksakan lewat constraint database. Kotak solid = tabel milik <b>Server MIS UUS SLIK</b> sendiri, dengan relasi FK asli: <code>ETL_RUN_LOG</code> (1) ke <code>ETL_D01_HISTORY</code>, <code>ETL_D02_HISTORY</code>, dan <code>SLIK_SSIS_PROCESS_LOG</code> (N) lewat <code>run_id</code>.
    </figcaption>
  </figure>
