<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.25rem; font-weight: 650; margin: 0 0 0.2rem; }
  .subtitle { font-size: 0.92rem; opacity: 0.65; margin: 0 0 2rem; }
  figure { margin: 0; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  figcaption {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    line-height: 1.5;
    color: currentColor;
    opacity: 0.72;
    max-width: 820px;
  }
  figcaption b { opacity: 1; font-weight: 600; }
</style>

<div class="wrap">
  <h1>Data Flow Diagram — Level 2: PROSES SSIS (Diperbaiki)</h1>
  <p class="subtitle">GetDataSlikFromConfins — posisi data store dipindah sebelum Transform</p>

  <figure>
    <svg viewBox="0 0 1000 600" role="img" aria-label="ifin mengirim cif ke proses 1.1 Extract Data Confins. Data mentah disimpan ke data store SLIKDBUUS di Server MIS sebelum divalidasi. Proses 1.2 Transform Data membaca dan memperbarui data store itu, hasilnya diteruskan sebagai Cleaned Data ke 1.3 Load Data to Target yang menulis ke IFIN, lalu 1.4 Send Response to ifin mengirim Return Data SLIK kembali ke ifin.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- ifin entity -->
      <rect x="390" y="20" width="200" height="75" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="490" y="65" text-anchor="middle" font-size="18">ifin</text>

      <!-- Entity <-> process arrows -->
      <line x1="435" y1="95" x2="435" y2="185" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="450" y="145" font-size="11">1 Sent cif</text>

      <line x1="565" y1="185" x2="565" y2="95" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="580" y="145" font-size="11">2 Return Data SLIK</text>

      <!-- Outer boundary -->
      <rect x="60" y="185" width="800" height="360" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <text x="80" y="210" font-size="12.5" font-weight="650">PROSES SSIS</text>

      <!-- Row 1 -->
      <rect x="100" y="235" width="170" height="80" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="185" y="266" text-anchor="middle" font-size="12">1.1 Extract Data C</text>
      <text x="185" y="284" text-anchor="middle" font-size="12">( Confins )</text>

      <!-- Data store: moved BEFORE transform -->
      <line x1="360" y1="248" x2="590" y2="248" stroke="currentColor" stroke-width="1.4"/>
      <line x1="360" y1="303" x2="590" y2="303" stroke="currentColor" stroke-width="1.4"/>
      <text x="475" y="270" text-anchor="middle" font-size="12">Data Store : SLIKDBUUS</text>
      <text x="475" y="288" text-anchor="middle" font-size="12">( Server MIS )</text>

      <rect x="650" y="235" width="170" height="80" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="735" y="266" text-anchor="middle" font-size="12">1.2 Transform</text>
      <text x="735" y="284" text-anchor="middle" font-size="12">Data</text>

      <line x1="270" y1="275" x2="358" y2="275" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="314" y="265" text-anchor="middle" font-size="11">Raw Data</text>

      <line x1="592" y1="265" x2="648" y2="265" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="648" y1="290" x2="592" y2="290" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="620" y="325" text-anchor="middle" font-size="10.5">baca / update</text>

      <!-- 1.2 down to 1.3 -->
      <polyline points="735,315 735,355 590,355" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="662" y="345" text-anchor="middle" font-size="11">Cleaned Data</text>

      <!-- Row 2 -->
      <rect x="360" y="355" width="230" height="80" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="475" y="391" text-anchor="middle" font-size="12">1.3 Load Data to Target</text>
      <text x="475" y="409" text-anchor="middle" font-size="10.5" opacity="0.68">( UPDATE ke IFIN )</text>

      <rect x="100" y="355" width="170" height="80" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="185" y="386" text-anchor="middle" font-size="12">1.4 Send</text>
      <text x="185" y="404" text-anchor="middle" font-size="12">Response to ifin</text>

      <line x1="358" y1="395" x2="270" y2="395" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="314" y="385" text-anchor="middle" font-size="11">Loaded</text>
    </svg>

    <figcaption>
      <b>1.1</b> menarik data mentah dari Confins, disimpan ke data store <b>SLIKDBUUS</b> (Server MIS) — posisinya di SINI, sebelum transform, karena itu memang gunanya staging: tempat data mentah landing dulu. <b>1.2</b> membaca &amp; memperbarui data store itu lewat SQL function validasi, hasilnya diteruskan ke <b>1.3</b> yang menulis (UPDATE) ke IFIN, lalu <b>1.4</b> mengirim <b>Return Data SLIK</b> kembali ke <b>ifin</b>.
    </figcaption>
  </figure>
</div>
